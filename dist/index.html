<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flex">
  <meta name="description" content="Flex, espace de démonstration mobile avec comptes multidevises, cartes, épargne et montants fictifs.">
  <title>Flex — Démonstration</title>
  <style>
    body{margin:0;background:#0a1019}
    .app-splash{position:fixed;inset:0;z-index:1000;background:#0f1213;color:#f2f5fa;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;transition:opacity .35s ease,visibility .35s ease}
    .splash-logo{width:min(256px,62vw,42vh);height:min(256px,62vw,42vh);display:grid;place-items:center}
    .splash-logo img{width:100%;height:100%;object-fit:contain;display:block}
    .splash-caption{font-size:11px;color:#8e9aad;margin-top:13px;text-align:center;line-height:1.7}
    .splash-track{height:2px;width:82px;overflow:hidden;background:#21352f;border-radius:2px;margin-top:25px}
    .splash-track span{height:100%;width:38px;background:#72d9b5;display:block;animation:splash-progress 1.2s ease-in-out infinite}
    .splash-demo{font-size:8px;letter-spacing:1.5px;color:#64728a;position:absolute;bottom:calc(36px + env(safe-area-inset-bottom))}
    .splash-retry{background:#25344d;color:#c4d9fb;border:0;border-radius:12px;padding:12px 18px;margin-top:18px}
    .app-splash.splash-done{opacity:0;visibility:hidden;pointer-events:none}
    @keyframes splash-progress{0%{transform:translateX(-38px)}100%{transform:translateX(82px)}}
    @media(prefers-reduced-motion:reduce){.splash-track span{animation:none}.app-splash{transition:none}}
  </style>
  <link rel="icon" href="./icon.svg?v=9" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=9">
  <link rel="manifest" href="./manifest.webmanifest?v=9">
  <link rel="stylesheet" href="./styles.css?v=9">
  <link rel="stylesheet" href="./expenses.css?v=1">
  <link rel="stylesheet" href="./editor.css?v=1">
  <link rel="stylesheet" href="./design.css?v=10">
</head>
<body class="dark">
  <div id="app-splash" class="app-splash" role="status" aria-label="Chargement de Flex">
    <div class="splash-logo"><img src="./icon-512.png?v=9" alt="" width="256" height="256"></div>
    <p id="splash-caption" class="splash-caption">Votre espace se prépare.</p>
    <div class="splash-track" aria-hidden="true"><span></span></div>
    <button id="splash-retry" class="splash-retry" hidden>Réessayer</button>
    
  </div>
  <div class="desktop-note" aria-hidden="true">
    <span class="desktop-brand">flex</span>
    <h1>Votre quotidien.<br>En mouvement.</h1>
    <p>Un espace personnel pour explorer<br>une autre façon de gérer l’argent.</p>
    <div class="desktop-caption"><span class="dot"></span> EXPÉRIENCE MOBILE</div>
  </div>
  <div class="phone-shell">
    <main id="app" aria-live="polite"></main>
    <div id="sheet-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
   <footer class="global-disclosure" aria-label="Application de démonstration sans compte bancaire réel">Démonstration — aucun compte réel</footer>
  <noscript><style>.app-splash{display:none}</style><p style="color:#fff">Active JavaScript pour ouvrir cette cette application.</p></noscript>
  <script src="./startup.js?v=9" defer></script>
  <script type="module" src="./app.js?v=10"></script>
</body>
</html>
